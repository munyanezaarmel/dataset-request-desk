services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: dataset_desk
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d dataset_desk"]
      interval: 3s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    command: ["sh", "start.sh", "--reload"]   # migrate, seed, then serve (auto-reload for development)
    environment:
      DATABASE_URL: postgresql+psycopg://app:app@db:5432/dataset_desk
      JWT_SECRET: dev-only-change-me-in-production
    volumes:
      - ./backend:/app
      - ./seed:/seed:ro
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata: